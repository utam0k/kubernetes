- name: MemoryLeakDetection
  defaultPodTemplatePath: ../templates/pod-default.yaml
  workloadTemplate:
  - opcode: createNodes
    countParam: $initNodes
  - opcode: createNamespaces
    count: 3
    prefix: test-ns
  # Repeated create/delete cycles to detect memory leaks
  - opcode: createPods
    count: 1000
    namespace: test-ns-0
  - opcode: deletePods
    namespace: test-ns-0
  - opcode: sleep
    duration: 10s
  - opcode: createPods
    count: 1000
    namespace: test-ns-1
  - opcode: deletePods
    namespace: test-ns-1
  - opcode: sleep
    duration: 10s
  - opcode: createPods
    count: 1000
    namespace: test-ns-2
  - opcode: deletePods
    namespace: test-ns-2
  - opcode: sleep
    duration: 10s
  # Final measurement
  - opcode: createPods
    countParam: $measurePods
    collectMetrics: true
  - opcode: sleep
    duration: 30s
  workloads:
  - name: 100Nodes_LeakDetection
    labels: [memory-test, memory-leak, short]
    params:
      initNodes: 100
      measurePods: 100
  - name: 1000Nodes_LeakDetection
    labels: [memory-test, memory-leak]
    params:
      initNodes: 1000
      measurePods: 1000

- name: MemoryHighChurn
  defaultPodTemplatePath: ../templates/pod-default.yaml
  workloadTemplate:
  - opcode: createNodes
    countParam: $initNodes
  - opcode: createPods
    countParam: $initPods
    collectMetrics: true
  - opcode: churn
    mode: recreate
    number: 1000
    intervalMilliseconds: 1000
    templatePaths:
    - ../templates/pod-default.yaml
  - opcode: sleep
    duration: 5m
  workloads:
  - name: 100Nodes_HighChurn
    labels: [memory-test, memory-leak, short]
    params:
      initNodes: 100
      initPods: 500
  - name: 1000Nodes_HighChurn
    labels: [memory-test, memory-leak]
    params:
      initNodes: 1000
      initPods: 5000

- name: MemorySteadyState
  defaultPodTemplatePath: ../templates/pod-default.yaml
  workloadTemplate:
  - opcode: createNodes
    countParam: $initNodes
  - opcode: createPods
    countParam: $initPods
  - opcode: createPods
    countParam: $measurePods
    collectMetrics: true
    steadyState: true
    duration: 10m
  workloads:
  - name: 100Nodes_SteadyState
    labels: [memory-test, short]
    params:
      initNodes: 100
      initPods: 500
      measurePods: 100
  - name: 1000Nodes_SteadyState
    labels: [memory-test]
    params:
      initNodes: 1000
      initPods: 5000
      measurePods: 1000
  - name: 5000Nodes_SteadyState
    labels: [memory-test, memory-stress]
    params:
      initNodes: 5000
      initPods: 25000
      measurePods: 5000
  - name: 10000Nodes_SteadyState_Long
    labels: [memory-test, memory-stress, long-running]
    params:
      initNodes: 10000
      initPods: 50000
      measurePods: 50000