# Memory usage test cases for detecting memory leaks and high memory consumption patterns
#
# Labels:
# - memory-test: test cases specifically designed for memory analysis
# - memory-leak: test cases to detect potential memory leaks
# - memory-stress: test cases that put stress on memory usage
#

- name: MemoryBaseline
  defaultPodTemplatePath: ../templates/pod-default.yaml
  workloadTemplate:
  - opcode: createNodes
    countParam: $initNodes
  - opcode: sleep
    duration: 10s
  - opcode: createPods
    countParam: $measurePods
    collectMetrics: true
  - opcode: sleep
    duration: 30s
  workloads:
  - name: 100Nodes_Baseline
    labels: [memory-test, short]
    params:
      initNodes: 100
      measurePods: 1000
  - name: 1000Nodes_Baseline
    labels: [memory-test, memory-demo]
    params:
      initNodes: 1000
      measurePods: 10000
  - name: 5000Nodes_Baseline
    labels: [memory-test, memory-stress]
    params:
      initNodes: 5000
      measurePods: 50000
  - name: 10000Nodes_LongRunning
    labels: [memory-test, memory-stress, long-running, memory-demo]
    params:
      initNodes: 10000
      measurePods: 100000
  - name: 15000Nodes_LongRunning
    labels: [memory-test, memory-stress, long-running, memory-demo]
    params:
      initNodes: 15000
      measurePods: 150000

